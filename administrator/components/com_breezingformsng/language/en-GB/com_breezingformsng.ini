COM_BREEZINGFORMSNG_QM_FILE_RESIZE_TYPE="If resize widths and heights are given it'll resize under these conditions: if left empty, the uploaded image will be resized (scaled) to fit into the boundaries of the given widht and height, using the BG-Color as background for what's left. If 'crop' is entered, the image will be sliced to fit into the entire given dimensions. 'simple' will scale the images as you know from regular web browsers."
