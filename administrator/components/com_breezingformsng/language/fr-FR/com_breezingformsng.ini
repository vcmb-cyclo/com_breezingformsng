COM_BREEZINGFORMSNG_INSTALL_STEP2MSG="<p>Le composant est maintenant installé avec succès. L'étape suivante crée ou met à jour les tables respectives de la base de données.</p><p>L'installation détecte automatiquement si vous mettez à jour à partir d'une version précédente et propose le mode correct. Cependant vous devriez conserver ce choix s'il est réellement correct pour votre configuration.</p><p>Vous pouvez aussi choisir d'installer des Packages en option. Il est recommandé d'installer les exemples standards car c'est une source d'informations majeure.</p><p>Veuillez vérifier la concordance des options et cliquer sur <em>Continuer</em></p>"
