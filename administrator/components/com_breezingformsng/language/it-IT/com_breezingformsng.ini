COM_BREEZINGFORMSNG_INSTALL_STEP2MSG="<p>Il programma è stato installato correttamente. Il prossimo passo è creare o aggiornare di conseguenza le tabelle del database.</p><p>L'installazione rileva automaticamente se stai effettuando l'aggiornamento da una versione precedente e propone la modalità corretta. Tuttavia, dovresti comunque verificare che sia appropriato per la tua configurazione.</p><p>Puoi anche scegliere di installare pacchetti facoltativi. Si consiglia di installare gli esempi standard poiché sono una fonte importante di informazioni.</p><p>Controlla le opzioni corrispondenti e quindi fai clic su <em>Continua</em> per procedere:</p>"
