COM_BREEZINGFORMSNG_QM_SECTION_TURNOFF="Disattiva questa sezione per impostazione predefinita. Di solito hai bisogno di questo in combinazione con le regole di visibilità. Tieni presente che i campi in questa sezione continueranno a far scattare le convalide se non è specificata almeno una regola di visibilità."
COM_BREEZINGFORMSNG_QM_ELEMENT_ORDER_NUMBER="Specifica l'ordine dell'elemento definendo un numero. Il numero d'ordine determina l'ordine di visualizzazione degli elementi ad esempio nelle email di notifica, nel gestore di record ecc. L'impostazione predefinita è -1, il che significa che il numero d'ordine verrà dato internamente, automaticamente."
