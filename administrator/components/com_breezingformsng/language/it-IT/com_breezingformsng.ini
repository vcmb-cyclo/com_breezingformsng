COM_BREEZINGFORMSNG_QM_TEXTFIELD_MAILBACK_FILE="Aggiungi un percorso assoluto del server a un file che desideri allegare all'email mailback inviata all'indirizzo email specificato. Mailback è necessario per essere abilitato affinché funzioni. Assicurati anche che il percorso del file sia corretto."
