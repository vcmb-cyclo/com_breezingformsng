COM_BREEZINGFORMSNG_QM_VALIDATION_SCRIPTLIBRARY="Scegli la convalida del campo desiderata. Assicurati che la convalida si adatti al tipo che desideri convalidare (ad esempio ff_valuenotempty non funzionerebbe sui gruppi di caselle di controllo)."
