COM_BREEZINGFORMSNG_QM_VALIDATION_TYPE="Scegli il tipo di convalida desiderato. Nessuno: nessuna convalida deve essere eseguita. Libreria: scegli da un elenco di convalide disponibili. Puoi regolare o creare nuove convalide di libreria nella sezione Script di BreezingForms. Personalizzato: crea nuove convalide al volo usando javascript. Utile se quella convalida viene utilizzata una sola volta, molto speciale, per questo particolare elemento. Le convalide ricorrenti che ti servono frequentemente devono comunque essere gestite nella sezione Script."
