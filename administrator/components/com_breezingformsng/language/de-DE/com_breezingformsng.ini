COM_BREEZINGFORMSNG_QM_SELECTLIST_WIDTH="The width of this element in px or % (as in css)."
COM_BREEZINGFORMSNG_QM_SELECTLIST_HEIGHT="The height of this element in px or % (as in css)."
COM_BREEZINGFORMSNG_QM_SELECTLIST_READONLY="Enable this to set this select list readonly."
COM_BREEZINGFORMSNG_QM_FILE_READONLY="Enable this to set this file upload readonly."
COM_BREEZINGFORMSNG_QM_VALIDATION_REQUIRED="Enable this if you want to display a required asterisk near the field label. PLEASE NOTE: this does _NOT_ set the field required as in the meaning of a validation. To validate a field, please see below."
COM_BREEZINGFORMSNG_QM_VALIDATION_TYPE="Choose the desired type of validation. None: No validation needs to be performed. Library: choose from a list of available validations. You may adjust or create new library validations in BreezingForms Scripts section. Custom: create new validations on the fly using javascript. Handy if that validation is only used once, very special, for this particular element. Recurring validations that you need frequently should be managed in the Scripts section, though."
COM_BREEZINGFORMSNG_QM_VALIDATION_ERROR_MESSAGE="Specify a validation error message here. Please use something that clearly and in simple words indicates what field is not correctly filled in."
COM_BREEZINGFORMSNG_QM_VALIDATION_SCRIPTLIBRARY="Please choose the desired field validation. Please make sure that the validation fits the type you want to validate against (for example ff_valuenotempty wouldn't work on checkbox groups)."
COM_BREEZINGFORMSNG_QM_VALIDATION_CODEFRAMEWORK="Click this to create the code framework in which you may add your custom validation code."
COM_BREEZINGFORMSNG_QM_SECTION_TURNOFF="Turn off this section by default. You usually need this in conjunction with visibility rules. Be aware that fields in this section still will fire validations if there is not at least one visibility rule specified."
COM_BREEZINGFORMSNG_QM_ELEMENT_ORDER_NUMBER="Specify the order of the element by defining a number. The order number determines the display order of elements for example in notification emails, record manager etc. Default is -1, which means the order number will be given internally, automatically."
COM_BREEZINGFORMSNG_QM_ELEMENT_LOGGING="If disabled, BreezingForms won't store the element value, neither in database, nor in email notifications and so on."
COM_BREEZINGFORMSNG_QM_SUMMARIZE_CALC="This field accepts javascript for calculating values from the values of different form elements and adds them up into this summary item. Example for a summing a field value with the value from a summary and storing the result back to the summary element: value = Number( value ) + Number( bfField( 'FIELDNAME' ) );"
COM_BREEZINGFORMSNG_QM_TEXTFIELD_PASSWORD="Enable this if this textfield should act as password field"
COM_BREEZINGFORMSNG_QM_TEXTFIELD_READONLY="Enable this if the textfield should be readonly."
COM_BREEZINGFORMSNG_QM_TEXTFIELD_MAILBACK="Enable this to enable the mailback feature (aka autoresponder). If enabled and this field is supposed to accept emails, it'll send a copy of the submission to the specified email address sent with the submission. You may edit the email template in form => advanced => more options => Mailback Emails Tab"
COM_BREEZINGFORMSNG_QM_TEXTFIELD_MAILBACK_AS_SENDER="If mailback above is enabled and this is checked, all emails that get sent will have the reply-to address given with this field's email address."
COM_BREEZINGFORMSNG_QM_TEXTFIELD_MAILBACK_FILE="Add a absolute server path to a file that you wish to attach to the mailback email sent to the given email address. Mailback is required to be enabled for this to work. Also make sure the path to the file is correct."
COM_BREEZINGFORMSNG_QM_ELEMENT_HIDE_LABEL="If enabled, the label will be hidden in the form"
COM_BREEZINGFORMSNG_QM_SUBMIT_BUTTON_SOURCE="The image source for the submit button. If specified, the button will be displayed as image submit button."
COM_BREEZINGFORMSNG_QM_PAYPAL_IPN="Use IPN (Instant Payment Notifications) with PayPal. If this is enabled, you will need a token and add it in the regular element properties tab."
COM_BREEZINGFORMSNG_QM_PAYPAL_IMAGE="Specify an alternative webpath to an image if you want a different image for the PayPal Button. Maybe also be linked from the PayPal example pages for buttons."
COM_BREEZINGFORMSNG_QM_PAYPAL_TESTACCOUNT="Enable this if you want to use your PayPal Sandbox test account. Please check the PayPal docs on how to use the sandbox."
COM_BREEZINGFORMSNG_QM_PAYPAL_TESTBUSINESS="If test account is enabled, specify your test business (email address) here."
COM_BREEZINGFORMSNG_QM_PAYPAL_TESTTOKEN="If test account is enabled, specify your test token here. The token is not required, except you need to test paid downloads or IPN or anything that requires pyment verifications."
COM_BREEZINGFORMSNG_QM_PAYPAL_FILE="If enabled, it will redirect to the file download (path as specified below) after successfull payment. This feature requires the paypal token to be used, otherwise the verification will always fail."
COM_BREEZINGFORMSNG_QM_PAYPAL_FILEPATH="The absolute server path to the file after payment (the file path as seen by the server, no web path, not relative)."
COM_BREEZINGFORMSNG_QM_PAYPAL_TRIES="The maximum allowed downloads after a successful payment."
COM_BREEZINGFORMSNG_QM_SOFORT_IMAGE="The path to the image of this payment button."
COM_BREEZINGFORMSNG_QM_SOFORT_FILE="If enabled, it will redirect to the file download (path as specified below) after successfull payment."
COM_BREEZINGFORMSNG_QM_SOFORT_FILEPATH="The absolute server path to the file after payment (the file path as seen by the server, no web path, not relative)."
COM_BREEZINGFORMSNG_QM_SOFORT_TRIES="The maximum allowed downloads after a successful payment."
COM_BREEZINGFORMSNG_QM_MAILBACK_ACCEPT="If enabled, the mailback (autoresponder) emails will only be sent if this checkbox is checked. You need to specify the name of the field that holds the email address below + mailback needs to be activated in that element."
COM_BREEZINGFORMSNG_QM_MAILBACK_CONNECTWITH="The name of the element that acts as mailback and holds the email address as given by the user. The element's mailback option needs to be enabled in order to work."
COM_BREEZINGFORMSNG_QM_SELECT_MAILBACK="If enabled, email notifications will be sent to the email address selected from this list. The email addresses need to be speficied in the list definition in order to make this work."
COM_BREEZINGFORMSNG_QM_FILE_HTML5="Wichtig: Bitte keine Unterstriche in den Namen von Upload-Elementen verwenden (ist reserviert). Enable this to use HTML5 upload techniques (upload progress, multiple uploads, large files, etc.). If a browser can't deal with HTML5 uploads, it will either try to use the flash equivalent (if enabled) or mimic a classic HTML4 upload."
COM_BREEZINGFORMSNG_QM_FILE_FLASH="Enable this to enable Flash upload support. If HTML5 uploads are enabled, it'll try to use them, if the browser can't deal with HTML, it'll use Flash instead. Please note the description at the bottom of this option for further information."
COM_BREEZINGFORMSNG_QM_FILE_MULTI="Allow/Disallow multiple uploads in a single HTML5/Flash upload element."
COM_BREEZINGFORMSNG_QM_FILE_BYTES="The maximum allowed file size in bytes."
COM_BREEZINGFORMSNG_QM_FILE_WIDTH="The width of the upload element in pixels"
COM_BREEZINGFORMSNG_QM_FILE_HEIGHT="The height of the upload element in pixels"
COM_BREEZINGFORMSNG_QM_FILE_TRANSPARENT="Set the HTML5/Flash upload image being transparent or not (usually not required)."
COM_BREEZINGFORMSNG_QM_FILE_UPLOAD_DIRECTORY="Specify a custom upload directory here. Should be either the {ff_uploads} substitution or an absolute internal server path (not a web path). The {ff_uploads} substritute can also be adjusted in BreezingForms' main configuration."
COM_BREEZINGFORMSNG_QM_FILE_RESIZE_WIDTH="Speficy a width in pixels to resize to if the uploaded file(s) is/are supported file types (gif, png, jpg)."
COM_BREEZINGFORMSNG_QM_FILE_RESIZE_HEIGHT="Speficy a height in pixels to resize to if the uploaded file(s) is/are supported file types (gif, png, jpg)."
COM_BREEZINGFORMSNG_QM_FILE_RESIZE_TYPE="If resize widths and heights are given it'll resize under these conditions: if left empty, the uploaded image will be resized (scaled) to fit into the boundaries of the given widht and height, using the BG-Color as background for what's left. If 'crop' is entered, the image will be sliced to fit into the entire given dimensions. 'simple' will scale the images as you know from regular web browsers."
COM_BREEZINGFORMSNG_QM_FILE_RESIZE_BGCOLOR="The background color for the resized image. Usually being used if the resize type is left empty."
COM_BREEZINGFORMSNG_QM_FILE_TIMESTAMP="Enable this to add a timestamp to the filename upon upload."
COM_BREEZINGFORMSNG_QM_FILE_EXTENSIONS="Add allowed file extensions separated by commma"
COM_BREEZINGFORMSNG_QM_FILE_ATTACHUSERMAIL="Enable this to attach the uploaded file(s) to mailback emails (autoresponders)"
COM_BREEZINGFORMSNG_QM_FILE_ATTACHADMINMAIL="Enable this to attach the uploaded file(s) to the admin notification emails"
COM_BREEZINGFORMSNG_QM_FILE_USEURL="Use the web url instead of the absolute server path in notification emails. This will enable users to download the files on click. Please note that the path is computed by BreezingForms and may be wrong. Please make sure the paths are correct when setting this up."
COM_BREEZINGFORMSNG_QM_FILE_USEURL_DIR="The directory as seen from web where the uploads are stored."
COM_BREEZINGFORMSNG_QM_ELEMENT_MAILBACK_HIDE="Hide this element value in mailback emails. Useful if only admins may see certain values."
COM_BREEZINGFORMSNG_QM_ELEMENT_TABINDEX="Use numbers tp specify a different tab index than the default. May be useful if you want to change the tab order of your form application. Default is -1, which means handled internally by BreezingForms."
COM_BREEZINGFORMSNG_QM_ELEMENT_TURNOFF="Turn off the element. Usually used in combination with visibility rules. Please keep in mind that validations still might fire for this turned off elements if not at least one visibility rule has been added."
COM_BREEZINGFORMSNG_QM_ELEMENT_LABELPOS="The desired label position for this element."
COM_BREEZINGFORMSNG_QM_INITSCRIPT="Enable an init script (=javascript) for this element if you need to run something upon form or page entry. You can either choose existing init scripts from the library or create your own custom one on-the-fly. Custom on-the-fly init scripts should only be used if they are really special for this element. If you use an init script more than once, then it is recommended to add an init script in the Scripts library and choose it from the library list instead."
COM_BREEZINGFORMSNG_QM_INITSCRIPT_CODEFRAMEWORK="Click this to create the code framework in which you may add your custom init code."
COM_BREEZINGFORMSNG_QM_ACTIONSCRIPT="Enable an action script (=javascript) for this element if you need to run something upon element action - such as onclick, onchange, onfocus, etc.. You can either choose existing action scripts from the library or create your own custom one on-the-fly. Custom on-the-fly action scripts should only be used if they are really special for this element. If you use an action script more than once, then it is recommended to add an action script in the Scripts library and choose it from the library list instead."
COM_BREEZINGFORMSNG_QM_ACTIONSCRIPT_CODEFRAMEWORK="Click this to create the code framework in which you may add your custom action code."

