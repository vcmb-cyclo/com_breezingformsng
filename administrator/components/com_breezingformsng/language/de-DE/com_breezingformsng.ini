COM_BREEZINGFORMSNG_INSTALL_STEP2MSG="<p>Das Programm wurde nun erfolgreich installiert. Als nächster Schritt sind die Datenbanktabellen zu erzeugen oder zu aktualisieren.</p><p>Das Installationsprogramm erkennt automatisch die allfällig vorhandenen Tabellen einer vorher installierten Version und schlägt die richtige Installations- oder Updateart vor. Der Vorschlag sollte jedoch kontrolliert werden.</p><p>Es besteht auch die Möglichkeit, optionale Pakete zu installieren. Es wird empfohlen die Standardmuster zu installieren da sie eine wichtige Informationsquelle darstellen.</p><p>Bitte die passenden Optionen markieren und dann oben im Menu Komponenten/BreezingForms/Konfiguration auswählen, um fortzufahren:</p>"
