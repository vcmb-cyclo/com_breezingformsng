PLG_PRIVACY_BREEZINGFORMSNG="Gizlilik - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="BreezingForms NG tarafından saklanan form gönderimleri için gizlilik dışa aktarma ve silme isteklerini işler. Yalnızca oturum açmış kullanıcıların gönderimleri kapsanır. Sitede saklanan yüklenmiş dosyalar ve imzalar, ait oldukları gönderimlerle birlikte silinir; güvenli biçimde silinemeyen bir dosya plg_privacy_breezingformsng.php günlüğüne kaydedilir. Başka yerlere gönderilen kopyalar (Dropbox, e-posta ekleri) bundan etkilenmez."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Gönderimleri sil"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Evet: silme isteği kullanıcının gönderimlerini siler. Hayır: gönderimler anonim satırlar olarak saklanır (yalnızca form ve tarihler); girilen tüm değerler, IP adresi, tarayıcı, ad, hesap, ödeme referansı ve onay belirteci silinir."
