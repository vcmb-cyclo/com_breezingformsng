PLG_PRIVACY_BREEZINGFORMSNG="Gizlilik - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="BreezingForms NG tarafından saklanan form gönderimleri için gizlilik dışa aktarma ve silme isteklerini işler. Yalnızca oturum açmış kullanıcıların gönderimleri kapsanır. Sitede saklanan yüklenmiş dosyalar ve imzalar, ait oldukları gönderimlerle birlikte silinir; güvenli biçimde silinemeyen bir dosya plg_privacy_breezingformsng.php günlüğüne kaydedilir. ContentBuilder NG tarafından bu gönderimlerden oluşturulan makaleler, formu silinen kayıtların makalelerini silecek şekilde ayarlanmışsa silinir; aksi halde yerinde bırakılır ve aynı günlüğe kaydedilir. Başka yerlere gönderilen kopyalar (Dropbox, e-posta ekleri) bundan etkilenmez."
