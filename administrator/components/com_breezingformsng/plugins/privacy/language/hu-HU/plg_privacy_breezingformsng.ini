PLG_PRIVACY_BREEZINGFORMSNG="Adatvédelem - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Kezeli a BreezingForms NG által tárolt űrlapbeküldésekre vonatkozó adatvédelmi export- és törlési kérelmeket. Csak a bejelentkezett felhasználók beküldéseire vonatkozik. A webhelyen tárolt feltöltött fájlok és aláírások azokkal a beküldésekkel együtt törlődnek, amelyekhez tartoznak; a biztonságosan nem törölhető fájlok a plg_privacy_breezingformsng.php naplóban szerepelnek. A ContentBuilder NG által ezekből a beküldésekből létrehozott cikkek szintén törlődnek, ha az űrlapja a törölt rekordok cikkeinek törlésére van beállítva; ellenkező esetben a helyükön maradnak, és ugyanabban a naplóban szerepelnek. A máshová küldött másolatokat (Dropbox, e-mail-mellékletek) ez nem érinti."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Beküldések törlése"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Igen: a törlési kérelem törli a felhasználó beküldéseit. Nem: a beküldések névtelen sorokként megmaradnak (csak az űrlap és a dátumok); minden beküldött érték, az IP-cím, a böngésző, a név, a fiók, a fizetési hivatkozás és a feliratkozási token törlődik."
