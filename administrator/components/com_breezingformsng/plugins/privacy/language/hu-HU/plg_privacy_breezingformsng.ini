PLG_PRIVACY_BREEZINGFORMSNG="Adatvédelem - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Kezeli a BreezingForms NG által tárolt űrlapbeküldésekre vonatkozó adatvédelmi export- és törlési kérelmeket. Csak a bejelentkezett felhasználók beküldéseire vonatkozik."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Beküldések törlése"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Igen: a törlési kérelem törli a felhasználó beküldéseit és azok értékeit. Nem: a beküldések megmaradnak, de leválasztódnak a felhasználóról (az IP-cím, a böngésző, a név és a fiók törlődik); a beküldött értékek megmaradnak."
