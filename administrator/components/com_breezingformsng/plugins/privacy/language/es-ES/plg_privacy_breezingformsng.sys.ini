PLG_PRIVACY_BREEZINGFORMSNG="Privacidad - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Gestiona las solicitudes de exportación y eliminación de datos personales para los envíos de formularios guardados por BreezingForms NG. Solo se incluyen los envíos realizados por un usuario conectado. Los archivos subidos y las firmas almacenados en el sitio se eliminan junto con los envíos a los que pertenecen; un archivo que no puede eliminarse con seguridad se anota en el registro plg_privacy_breezingformsng.php. Los artículos generados por ContentBuilder NG a partir de estos envíos también se eliminan cuando su formulario está configurado para eliminar los artículos de los registros eliminados; en caso contrario, se dejan en su lugar y se anotan en el mismo registro. Las copias enviadas a otros lugares (Dropbox, archivos adjuntos de correo electrónico) no se ven afectadas."
