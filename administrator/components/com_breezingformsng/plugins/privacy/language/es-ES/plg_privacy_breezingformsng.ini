PLG_PRIVACY_BREEZINGFORMSNG="Privacidad - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Gestiona las solicitudes de exportación y eliminación de datos personales para los envíos de formularios guardados por BreezingForms NG. Solo se incluyen los envíos realizados por un usuario conectado."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Eliminar los envíos"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Sí: una solicitud de eliminación borra los envíos del usuario. No: los envíos se conservan como filas anónimas (solo formulario y fechas); todos los valores introducidos, la dirección IP, el navegador, el nombre, la cuenta, la referencia de pago y el token de suscripción se borran."
