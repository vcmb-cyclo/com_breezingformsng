PLG_PRIVACY_BREEZINGFORMSNG="Datenschutz - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Bearbeitet Datenschutzanfragen (Export und Löschung) für die von BreezingForms NG gespeicherten Formulareinsendungen. Es werden nur Einsendungen angemeldeter Benutzer berücksichtigt."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Einsendungen löschen"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Ja: Eine Löschanfrage entfernt die Einsendungen des Benutzers und deren Werte. Nein: Die Einsendungen bleiben erhalten, werden aber vom Benutzer getrennt (IP-Adresse, Browser, Name und Konto werden geleert); die eingegebenen Werte bleiben."
