PLG_PRIVACY_BREEZINGFORMSNG="Datenschutz - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Bearbeitet Datenschutzanfragen (Export und Löschung) für die von BreezingForms NG gespeicherten Formulareinsendungen. Es werden nur Einsendungen angemeldeter Benutzer berücksichtigt. Hochgeladene Dateien und Unterschriften, die auf der Website gespeichert sind, werden zusammen mit den zugehörigen Einsendungen gelöscht; eine Datei, die nicht sicher gelöscht werden kann, wird im Protokoll plg_privacy_breezingformsng.php aufgeführt. Anderswohin gesendete Kopien (Dropbox, E-Mail-Anhänge) sind nicht betroffen."
