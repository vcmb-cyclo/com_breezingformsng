PLG_PRIVACY_BREEZINGFORMSNG="Privacy - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Handles privacy export and removal requests for the form submissions stored by BreezingForms NG. Only submissions sent by a logged-in user are covered."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Delete submissions"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Yes: a removal request deletes the user's submissions and their values. No: the submissions are kept but detached from the user (IP address, browser, name and account are cleared); the submitted values stay."
