PLG_PRIVACY_BREEZINGFORMSNG="Privacy - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Handles privacy export and removal requests for the form submissions stored by BreezingForms NG. Only submissions sent by a logged-in user are covered. Uploaded files and signatures stored on the site are deleted along with the submissions they belong to; a file that cannot be deleted safely is listed in the plg_privacy_breezingformsng.php log. Articles generated by ContentBuilder NG from these submissions are deleted as well. Copies sent elsewhere (Dropbox, email attachments) are not affected."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Delete submissions"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Yes: a removal request deletes the user's submissions. No: the submissions are kept as anonymous rows (form and dates only); every submitted value, the IP address, browser, name, account, payment reference and opt-in token are erased."
