PLG_PRIVACY_BREEZINGFORMSNG="Privacy - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Verwerkt privacyverzoeken (export en verwijdering) voor de formulierinzendingen die BreezingForms NG opslaat. Alleen inzendingen van ingelogde gebruikers vallen hieronder. Geüploade bestanden en handtekeningen die op de site zijn opgeslagen, worden samen met de bijbehorende inzendingen verwijderd; een bestand dat niet veilig kan worden verwijderd, wordt vermeld in het logbestand plg_privacy_breezingformsng.php. Kopieën die elders naartoe zijn verzonden (Dropbox, e-mailbijlagen) blijven ongemoeid."
