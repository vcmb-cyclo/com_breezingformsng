PLG_PRIVACY_BREEZINGFORMSNG="Privacy - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Verwerkt privacyverzoeken (export en verwijdering) voor de formulierinzendingen die BreezingForms NG opslaat. Alleen inzendingen van ingelogde gebruikers vallen hieronder."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Inzendingen verwijderen"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Ja: een verwijderingsverzoek wist de inzendingen van de gebruiker. Nee: de inzendingen blijven bewaard als anonieme rijen (alleen formulier en datums); alle ingevulde waarden, het IP-adres, de browser, de naam, het account, de betalingsreferentie en het opt-in-token worden gewist."
