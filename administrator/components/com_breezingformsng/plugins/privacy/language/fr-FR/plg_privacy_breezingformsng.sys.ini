PLG_PRIVACY_BREEZINGFORMSNG="Confidentialité - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Traite les demandes d'export et de suppression de données personnelles pour les soumissions de formulaires enregistrées par BreezingForms NG. Seules les soumissions envoyées par un utilisateur connecté sont concernées. Les fichiers téléversés et les signatures stockés sur le site sont supprimés avec les soumissions auxquelles ils appartiennent ; un fichier qui ne peut pas être supprimé en toute sécurité est consigné dans le journal plg_privacy_breezingformsng.php. Les articles générés par ContentBuilder NG à partir de ces soumissions sont également supprimés lorsque son formulaire est réglé pour supprimer les articles des enregistrements supprimés ; sinon, ils sont laissés en place et consignés dans le même journal. Les copies envoyées ailleurs (Dropbox, pièces jointes d'e-mail) ne sont pas concernées."
