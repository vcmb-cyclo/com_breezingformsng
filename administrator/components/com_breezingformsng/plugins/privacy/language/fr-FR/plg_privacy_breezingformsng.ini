PLG_PRIVACY_BREEZINGFORMSNG="Confidentialité - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Traite les demandes d'export et de suppression de données personnelles pour les soumissions de formulaires enregistrées par BreezingForms NG. Seules les soumissions envoyées par un utilisateur connecté sont concernées. Les fichiers téléversés et les signatures stockés sur le site sont supprimés avec les soumissions auxquelles ils appartiennent ; un fichier qui ne peut pas être supprimé en toute sécurité est consigné dans le journal plg_privacy_breezingformsng.php. Les articles générés par ContentBuilder NG à partir de ces soumissions sont également supprimés. Les copies envoyées ailleurs (Dropbox, pièces jointes d'e-mail) ne sont pas concernées."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Supprimer les soumissions"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Oui : une demande de suppression efface les soumissions de l'utilisateur. Non : les soumissions sont conservées sous forme de lignes anonymes (formulaire et dates uniquement) ; toutes les valeurs saisies, l'adresse IP, le navigateur, le nom, le compte, la référence de paiement et le jeton d'inscription sont effacés."
