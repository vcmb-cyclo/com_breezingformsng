PLG_PRIVACY_BREEZINGFORMSNG="Privacy - BreezingForms NG"
PLG_PRIVACY_BREEZINGFORMSNG_XML_DESCRIPTION="Gestisce le richieste di esportazione e rimozione dei dati personali per gli invii dei moduli registrati da BreezingForms NG. Sono considerati solo gli invii effettuati da un utente autenticato. I file caricati e le firme memorizzati sul sito vengono eliminati insieme agli invii a cui appartengono; un file che non può essere eliminato in sicurezza viene riportato nel registro plg_privacy_breezingformsng.php. Le copie inviate altrove (Dropbox, allegati e-mail) non sono interessate."
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_LABEL="Eliminare gli invii"
PLG_PRIVACY_BREEZINGFORMSNG_REMOVE_RECORDS_DESC="Sì: una richiesta di rimozione elimina gli invii dell'utente. No: gli invii vengono conservati come righe anonime (solo modulo e date); tutti i valori inseriti, l'indirizzo IP, il browser, il nome, l'account, il riferimento di pagamento e il token di iscrizione vengono cancellati."
