PLG_WEBSERVICES_BREEZINGFORMSNG_XML_DESCRIPTION="Ajoute le point d'accès MCP de BreezingForms NG à l'API Joomla (api/index.php/v1/breezingformsng/mcp), pour qu'un assistant IA comme Claude Code ou Codex puisse travailler sur les formulaires avec le jeton d'API Joomla d'un utilisateur, dans la limite de ses droits. Désactivé par défaut : ne l'activez que si vous l'utilisez."
