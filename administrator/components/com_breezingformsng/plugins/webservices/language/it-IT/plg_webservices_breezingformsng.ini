PLG_WEBSERVICES_BREEZINGFORMSNG_XML_DESCRIPTION="Aggiunge all'API di Joomla l'endpoint MCP di BreezingForms NG (api/index.php/v1/breezingformsng/mcp), affinché un assistente IA come Claude Code o Codex possa lavorare sui moduli con il token API Joomla di un utente, nei limiti dei suoi permessi. Disattivato per impostazione predefinita: attivalo solo se lo usi."
