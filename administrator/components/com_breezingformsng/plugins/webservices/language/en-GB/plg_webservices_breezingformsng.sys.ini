PLG_WEBSERVICES_BREEZINGFORMSNG="Web Services - BreezingForms NG"
PLG_WEBSERVICES_BREEZINGFORMSNG_XML_DESCRIPTION="Adds the MCP endpoint of BreezingForms NG to the Joomla API (api/index.php/v1/breezingformsng/mcp), so that an AI assistant such as Claude Code or Codex can work on the forms with a user's Joomla API token, within that user's permissions. The endpoint exists only when MCP is enabled in the options of BreezingForms NG."
