PLG_WEBSERVICES_BREEZINGFORMSNG_XML_DESCRIPTION="Fügt der Joomla-API den MCP-Endpunkt von BreezingForms NG hinzu (api/index.php/v1/breezingformsng/mcp), damit ein KI-Assistent wie Claude Code oder Codex mit dem Joomla-API-Token eines Benutzers und im Rahmen von dessen Berechtigungen an den Formularen arbeiten kann. Standardmäßig deaktiviert: Aktivieren Sie es nur, wenn Sie es nutzen."
