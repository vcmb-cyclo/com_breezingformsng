PLG_WEBSERVICES_BREEZINGFORMSNG="Servicios web - BreezingForms NG"
PLG_WEBSERVICES_BREEZINGFORMSNG_XML_DESCRIPTION="Añade el punto de acceso MCP de BreezingForms NG a la API de Joomla (api/index.php/v1/breezingformsng/mcp), para que un asistente de IA como Claude Code o Codex pueda trabajar con los formularios usando el token de API de Joomla de un usuario y dentro de sus permisos. El punto de acceso solo existe si MCP está activado en las opciones de BreezingForms NG."
