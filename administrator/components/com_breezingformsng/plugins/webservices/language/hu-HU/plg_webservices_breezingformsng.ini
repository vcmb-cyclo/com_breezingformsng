PLG_WEBSERVICES_BREEZINGFORMSNG="Webszolgáltatások - BreezingForms NG"
PLG_WEBSERVICES_BREEZINGFORMSNG_XML_DESCRIPTION="Hozzáadja a BreezingForms NG MCP-végpontját a Joomla API-hoz (api/index.php/v1/breezingformsng/mcp), így egy MI-asszisztens, például a Claude Code vagy a Codex, egy felhasználó Joomla API-tokenjével, annak jogosultságain belül dolgozhat az űrlapokon. A végpont csak akkor létezik, ha az MCP engedélyezve van a BreezingForms NG beállításaiban."
