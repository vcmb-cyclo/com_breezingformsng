name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerability report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Report findings without blocking existing builds; execution errors still fail the job.
      - name: Scan dependency lockfiles
        # Pinned to the commit of the v0.36.0 tag: the repository of the action
        # re-published all its earlier tags in March 2026, and this step runs
        # with permission to write security events.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          version: v0.76.1

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-results.sarif

      - name: Preserve scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 14
