name: Psalm taint analysis

# CodeQL has no PHP support. Psalm follows request data across calls and
# files up to SQL, HTML, shell, file and eval sinks, which Semgrep OSS does
# not do. Trial run: the findings go to the code scanning alerts, they do not
# fail the build yet.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '27 14 * * 6'

permissions:
  contents: read

concurrency:
  group: psalm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psalm:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    name: Taint analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Psalm 6 crashes on PHP 8.5 (deprecated SplObjectStorage::attach()).
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-psalm-8.3-${{ hashFiles('composer.json', 'administrator/components/com_breezingformsng/composer.lock') }}
          restore-keys: composer-psalm-8.3-

      - name: Install analysis dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install \
            --working-dir=administrator/components/com_breezingformsng \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # Same Joomla copy as the PHPStan job: Psalm loads the classes it
      # analyses through its autoloader (psalm-bootstrap.php).
      - name: Cache extracted Joomla core stubs
        id: joomla-stubs-cache
        uses: actions/cache@v6
        with:
          path: joomla-stubs
          key: joomla-stubs-6.1.2-php8.3

      - name: Extract Joomla core for class discovery
        if: steps.joomla-stubs-cache.outputs.cache-hit != 'true'
        run: |
          container="$(docker create joomla:6.2.0-php8.3-apache)"
          mkdir -p joomla-stubs
          docker cp "${container}:/usr/src/joomla/libraries" joomla-stubs/libraries
          docker rm "${container}"

      # Exit code 2 means findings: they are reported, not a failure, while
      # the trial lasts. Any other failure (crash, configuration) still fails.
      - name: Run Psalm
        run: |
          set +e
          vendor/bin/psalm --taint-analysis --no-progress --no-cache --output-format=github --report=psalm.sarif
          status=$?
          set -e
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 2 ]; then
            exit "${status}"
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: psalm.sarif
          category: psalm
        if: always() && hashFiles('psalm.sarif') != ''
