name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '39 15 * * 6'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@v7

      # The project rules must still find what their test file expects.
      - name: Test the project rules
        run: semgrep --test --metrics=off --config .semgrep/joomla.yml .semgrep/joomla.php

      # Only the code of this project: the third-party libraries it ships are left out.
      - name: Scan the code
        run: >-
          semgrep scan
          --config p/php --config p/javascript --config p/security-audit --config p/secrets
          --config p/phpcs-security-audit --config .semgrep/
          --metrics=off --timeout 20
          --exclude vendor --exclude '*.min.js' --exclude 'jquery*'
          --sarif --output=semgrep.sarif
          administrator/components/com_breezingformsng/src
          administrator/components/com_breezingformsng/libraries/crosstec
          administrator/components/com_breezingformsng/tmpl
          administrator/components/com_breezingformsng/layouts
          administrator/components/com_breezingformsng/modules
          administrator/components/com_breezingformsng/plugins
          administrator/components/com_breezingformsng/services
          components/com_breezingformsng
          media/com_breezingformsng/js
          script.php

      # Semgrep keeps a finding marked "nosemgrep" in the SARIF, flagged as suppressed in the source, and
      # GitHub shows it as an open alert all the same. A suppression is reviewed in the code, with its reason on
      # the same comment, so those findings are left out of what GitHub receives.
      - name: Leave out the findings suppressed in the source
        run: |
          python3 - <<'PY'
          import json
          path = 'semgrep.sarif'
          with open(path) as handle:
              sarif = json.load(handle)
          for run in sarif['runs']:
              run['results'] = [result for result in run['results'] if not result.get('suppressions')]
          with open(path, 'w') as handle:
              json.dump(sarif, handle)
          PY

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.39.4
        with:
          sarif_file: semgrep.sarif
        if: always()
