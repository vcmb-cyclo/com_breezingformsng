name: Test and Build Package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - com_breezingformsng_update.xml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: PHP syntax check
        run: |
          set -o pipefail
          git ls-files -z '*.php' | xargs -0 -n1 -P4 php -l > /dev/null

  lint:
    name: PHP, XML and translation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The PHPCS check of a pull request compares with its base branch.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install PHP lint dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP coding standards
        run: composer lint:php

      - name: Check PHP coding standards of the changed files
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-phpcs-changed.py "origin/${{ github.base_ref }}"

      - name: PHP syntax check
        run: |
          set -o pipefail
          git ls-files -z '*.php' | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Validate XML files
        run: git ls-files -z '*.xml' | xargs -0 xmllint --noout

      - name: Check version consistency
        run: |
          manifest_version="$(grep -oPm1 '(?<=<version>)[^<]+' breezingformsng.xml)"
          update_version="$(grep -oPm1 '(?<=<version>)[^<]+' com_breezingformsng_update.xml)"
          # The release job publishes the update stream once the archive
          # exists, so the stream may lag behind the package, never lead it.
          if ! php -r 'exit(version_compare($argv[1], $argv[2], "<=") ? 0 : 1);' \
            "${update_version}" "${manifest_version}"; then
            echo "::error::Update stream ${update_version} is newer than package ${manifest_version}."
            exit 1
          fi

      - name: Check translations
        run: python3 scripts/check-translations.py

      - name: Check translation keys used in the code
        run: python3 scripts/check-translation-keys.py

      - name: Check SQL inserts
        run: python3 scripts/check-install-sql.py

      - name: Audit Composer dependencies
        working-directory: administrator/components/com_breezingformsng
        run: composer audit --locked --no-interaction

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Check inline scripts of the PHP templates
        run: npm run lint:inline-scripts

      - name: Run JavaScript tests
        run: npm run test:tree-model

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-phpstan-8.3-${{ hashFiles('composer.lock', 'administrator/components/com_breezingformsng/composer.lock') }}
          restore-keys: composer-phpstan-8.3-

      - name: Install analysis dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install \
            --working-dir=administrator/components/com_breezingformsng \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Cache extracted Joomla core stubs
        id: joomla-stubs-cache
        uses: actions/cache@v6
        with:
          path: joomla-stubs
          key: joomla-stubs-6.1.2-php8.3

      - name: Extract Joomla core for class discovery
        if: steps.joomla-stubs-cache.outputs.cache-hit != 'true'
        run: |
          container="$(docker create joomla:6.2.0-php8.3-apache)"
          mkdir -p joomla-stubs
          docker cp "${container}:/usr/src/joomla/libraries" joomla-stubs/libraries
          docker rm "${container}"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --error-format=github

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: ${{ matrix.php-version == '8.3' && 'pcov' || 'none' }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-tests-${{ matrix.php-version }}-${{ hashFiles('composer.lock', 'administrator/components/com_breezingformsng/composer.lock') }}
          restore-keys: composer-tests-${{ matrix.php-version }}-

      - name: Install test dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install \
            --working-dir=administrator/components/com_breezingformsng \
            --prefer-dist \
            --no-interaction \
            --no-progress
          # PdfDocumentTest renders real PDFs: compile the font resources the
          # package build also compiles (see scripts/build-package.sh).
          make -C administrator/components/com_breezingformsng/vendor/tecnickcom/tc-lib-pdf-font fonts

      - name: Run unit tests
        if: matrix.php-version != '8.3'
        run: vendor/bin/phpunit

      - name: Run unit tests and generate coverage reports
        if: matrix.php-version == '8.3'
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage/clover.xml \
            --coverage-html=coverage/html \
            --coverage-text

      - name: Enforce coverage threshold
        if: matrix.php-version == '8.3'
        run: php scripts/check-coverage.php coverage/clover.xml 30

      - name: Upload coverage reports
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-coverage
          path: coverage
          retention-days: 14

  package:
    name: Build and smoke-test package
    needs: [php-compatibility, lint, frontend-checks, phpstan, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: administrator/components/com_breezingformsng
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-package-8.3-${{ hashFiles('administrator/components/com_breezingformsng/composer.lock') }}
          restore-keys: composer-package-8.3-

      - name: Set package creation date
        run: |
          creation_date="$(TZ=Europe/Paris date +%F)"
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          perl -0pi -e "s#<creationDate>.*?</creationDate>#<creationDate>${creation_date}</creationDate>#" breezingformsng.xml
          perl -0pi -e "s#\\n\\s*<buildType>.*?</buildType>##g; s#(<creationDate>.*?</creationDate>)#\$1\n\t<buildType>production</buildType>#" breezingformsng.xml
          perl -0pi -e "s#\\n\\s*<buildTimestamp>.*?</buildTimestamp>##g; s#(<buildType>.*?</buildType>)#\$1\n\t<buildTimestamp>${build_timestamp}</buildTimestamp>#" breezingformsng.xml

      - name: Build production package
        id: package
        run: |
          archive="$(scripts/build-package.sh)"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Validate package contents
        run: scripts/validate-package.sh "${{ steps.package.outputs.archive }}"

      - name: Test installation, update and migration on Joomla
        run: scripts/joomla-install-smoke.sh "${{ steps.package.outputs.archive }}"

      - name: Setup Node.js for the browser journeys
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install the browser journeys tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser journeys on an installed Joomla
        run: scripts/joomla-e2e.sh "${{ steps.package.outputs.archive }}"

      - name: Upload the journey traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

      - name: Upload installation package
        uses: actions/upload-artifact@v7
        with:
          name: installation-package
          path: ${{ steps.package.outputs.archive }}
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, frontend-checks, phpstan, unit-tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publication at a time, whatever the tag: two tags must not rewrite
    # the "latest" release and the update stream concurrently.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download installation package
        uses: actions/download-artifact@v8
        with:
          name: installation-package
          path: build

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Resolve release metadata
        id: release
        run: |
          version="$(grep -oPm1 '(?<=<version>)[^<]+' breezingformsng.xml)"
          archive="build/com_breezingformsng-${version}.zip"
          test -f "${archive}"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          # Re-running an old tag must not downgrade what sites are offered:
          # only a version at least as recent as the published update stream
          # may become the latest release and rewrite that stream.
          git fetch origin main
          stream_version="$(git show origin/main:com_breezingformsng_update.xml | grep -oPm1 '(?<=<version>)[^<]+')"
          if php -r 'exit(version_compare($argv[1], $argv[2], ">=") ? 0 : 1);' "${version}" "${stream_version}"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v${version} is older than the published update stream (${stream_version}); the release is refreshed without becoming latest."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
          # A release candidate is a GitHub pre-release and never the latest
          # release, even when it feeds the update stream (tagged rc there).
          if [[ "${version}" =~ -RC[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate package checksum
        id: checksum
        run: |
          sha256="$(sha256sum "${{ steps.release.outputs.archive }}" | awk '{print $1}')"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      # Release notes come from the CHANGELOG.md section of this version,
      # headed "## <version>" (optionally followed by a date): rename the
      # "Unreleased" section before tagging.
      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          awk -v version="${RELEASE_VERSION}" '
            $0 == "## " version || index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty \"## ${RELEASE_VERSION}\" section."
            exit 1
          fi
          printf '\nSHA-256: %s\n' "${{ steps.checksum.outputs.sha256 }}" >> build/release-notes.md

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="${{ steps.release.outputs.archive }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${archive}" \
              --latest="${{ steps.release.outputs.current == 'true' && steps.release.outputs.prerelease == 'false' }}" \
              --prerelease="${{ steps.release.outputs.prerelease }}" \
              --target "${GITHUB_SHA}" \
              --title "BreezingForms NG ${GITHUB_REF_NAME}" \
              --notes-file build/release-notes.md
          fi

      - name: Ensure release is published
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            --notes-file build/release-notes.md \
            --prerelease="${{ steps.release.outputs.prerelease }}" \
            --latest="${{ steps.release.outputs.current == 'true' && steps.release.outputs.prerelease == 'false' }}"

      # Same mechanism as ContentBuilder NG: the update stream served from main
      # is rewritten only once the archive is published, with its checksum.
      - name: Publish update manifest to main
        if: steps.release.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_version="${{ steps.release.outputs.version }}"
          release_url="https://github.com/vcmb-cyclo/com_breezingformsng/releases/download/v${release_version}/com_breezingformsng-${release_version}.zip"
          gh release view "v${release_version}" --json assets \
            --jq '.assets[].name' | grep -Fx "com_breezingformsng-${release_version}.zip"
          stability=stable
          if [[ "${release_version}" =~ -RC[0-9]+$ ]]; then
            stability=rc
          fi
          git fetch origin main
          git switch -C main origin/main
          RELEASE_VERSION="${release_version}" RELEASE_URL="${release_url}" RELEASE_STABILITY="${stability}" \
            perl -0pi -e '
              s#(<version>)[^<]*(</version>)#$1$ENV{RELEASE_VERSION}$2#;
              s#(<downloadurl type="full" format="zip">)[^<]*(</downloadurl>)#$1$ENV{RELEASE_URL}$2#;
              s#(<tag>)[^<]*(</tag>)#$1$ENV{RELEASE_STABILITY}$2#;
              s#\n\s*<sha256>.*?</sha256>##g;
              s#(\n\s*</downloads>)#$1\n\t\t<sha256>${{ steps.checksum.outputs.sha256 }}</sha256>#;
            ' com_breezingformsng_update.xml
          if git diff --quiet -- com_breezingformsng_update.xml; then
            echo "Update manifest already current."
            exit 0
          fi
          git add com_breezingformsng_update.xml
          git commit -m "Publish update manifest for ${release_version}"
          git push origin main
